<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PixelMax</title>
<style>
  :root{
    --bg:#0f0f13; --panel:#17171d; --panel2:#1f1f28; --accent:#7c5cff;
    --text:#eee; --muted:#999; --border:#2a2a35;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100%;}
  header{
    display:flex;align-items:center;gap:10px;padding:8px 14px;
    background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap;
  }
  header h1{font-size:15px;font-weight:600;margin:0 12px 0 0;color:var(--accent);letter-spacing:.5px;}
  .group{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:5px 8px;}
  button{
    background:transparent;border:none;color:var(--text);cursor:pointer;
    padding:6px 8px;border-radius:7px;font-size:13px;display:flex;align-items:center;gap:5px;
    transition:background .12s, transform .08s;
  }
  button:hover{background:#2c2c38;}
  button:active{transform:scale(.94);}
  button.active{background:var(--accent);color:#fff;}
  input[type=color]{width:30px;height:30px;border:none;background:none;cursor:pointer;border-radius:6px;overflow:hidden;padding:0;}
  input[type=range],input[type=number]{accent-color:var(--accent);cursor:pointer;}
  input[type=number]{width:52px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:3px 5px;}
  label.small{font-size:11px;color:var(--muted);}
  #zoomVal{font-size:12px;color:var(--muted);width:38px;text-align:center;}
  #canvasWrap{
    flex:1;position:relative;overflow:auto;
    background:#0b0b0e;
    display:flex;align-items:center;justify-content:center;
  }
  #stage{position:relative;}
  canvas{position:absolute;top:0;left:0;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair;}
  #hint{
    position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
    background:rgba(0,0,0,.55);padding:5px 12px;border-radius:20px;font-size:11px;color:var(--muted);
    pointer-events:none;opacity:1;transition:opacity .6s;white-space:nowrap;
  }
  footer{
    padding:6px 14px;background:var(--panel);border-top:1px solid var(--border);
    font-size:11px;color:var(--muted);display:flex;justify-content:space-between;
  }
  .swatch{width:18px;height:18px;border-radius:50%;border:2px solid #444;cursor:pointer;flex:none;}
  .swatch.selected{border-color:#fff;}
  #palette{display:flex;gap:5px;align-items:center;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>▦ PixelMax</h1>

    <div class="group">
      <button id="toolPen" class="active" title="Pencil">✏️ Pencil</button>
      <button id="toolEraser" title="Eraser">🧽 Eraser</button>
      <button id="toolLine" title="Line">／ Line</button>
      <button id="toolRect" title="Rectangle">▭ Rect</button>
      <button id="toolCircle" title="Circle">◯ Circle</button>
      <button id="toolFill" title="Bucket fill">🪣 Fill</button>
      <button id="toolPicker" title="Color picker (eyedropper)">💧 Pick</button>
    </div>

    <div class="group">
      <input type="color" id="colorPicker" value="#7c5cff">
      <div id="palette"></div>
    </div>

    <div class="group">
      <label class="small">Grid</label>
      <input type="number" id="gridW" min="4" max="128" value="32">
      <span class="small">x</span>
      <input type="number" id="gridH" min="4" max="128" value="32">
      <button id="resizeBtn">Set</button>
    </div>

    <div class="group">
      <label class="small">Zoom</label>
      <input type="range" id="zoomRange" min="4" max="40" value="16">
      <span id="zoomVal">16px</span>
    </div>

    <div class="group">
      <button id="gridToggle" class="active" title="Toggle grid lines">▦ Grid Lines</button>
    </div>

    <div class="group">
      <button id="undoBtn" title="Undo (Ctrl+Z)">↶ Undo</button>
      <button id="redoBtn" title="Redo (Ctrl+Y)">↷ Redo</button>
      <button id="clearBtn" title="Clear canvas">🗑 Clear</button>
    </div>

    <div class="group">
      <button id="saveBtn" title="Download PNG (actual pixel size)">⬇ Save PNG</button>
      <button id="saveBigBtn" title="Download PNG upscaled 8x, crisp">⬇ Save PNG 8x</button>
    </div>
  </header>

  <div id="canvasWrap">
    <div id="stage">
      <canvas id="canvas"></canvas>
    </div>
    <div id="hint">Click/drag to draw pixels • Ctrl+Z undo • Ctrl+Shift+Z redo</div>
  </div>

  <footer>
    <span id="status">Ready — 32x32 grid</span>
    <span id="posInfo">–</span>
  </footer>
</div>

<script>
(function(){
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('canvasWrap');

  let GRID_W = 32, GRID_H = 32;
  let CELL = 16; // pixel size on screen
  let showGrid = true;

  // pixel data: array of hex color strings or null (transparent)
  let pixels = [];

  function initPixels(w,h,fill){
    const arr = new Array(w*h).fill(fill===undefined?null:fill);
    return arr;
  }
  pixels = initPixels(GRID_W, GRID_H);

  function idx(x,y){ return y*GRID_W+x; }

  function resizeCanvasDisplay(){
    canvas.width = GRID_W;
    canvas.height = GRID_H;
    canvas.style.width = (GRID_W*CELL)+'px';
    canvas.style.height = (GRID_H*CELL)+'px';
    stage.style.width = (GRID_W*CELL)+'px';
    stage.style.height = (GRID_H*CELL)+'px';
    render();
  }

  function render(){
    ctx.clearRect(0,0,GRID_W,GRID_H);
    // checkerboard for transparency, drawn at native res then scaled by CSS pixelated
    for(let y=0;y<GRID_H;y++){
      for(let x=0;x<GRID_W;x++){
        const c = pixels[idx(x,y)];
        if(c){
          ctx.fillStyle = c;
          ctx.fillRect(x,y,1,1);
        } else {
          ctx.fillStyle = ((x+y)%2===0) ? '#26262e' : '#1c1c22';
          ctx.fillRect(x,y,1,1);
        }
      }
    }
    drawGridOverlay();
  }

  // grid overlay drawn as separate canvas overlay via CSS background on stage (cheaper: draw lines with a second canvas)
  let gridCanvas = document.createElement('canvas');
  gridCanvas.style.position='absolute';
  gridCanvas.style.top='0';
  gridCanvas.style.left='0';
  gridCanvas.style.pointerEvents='none';
  stage.appendChild(gridCanvas);
  const gctx = gridCanvas.getContext('2d');

  function drawGridOverlay(){
    gridCanvas.width = GRID_W*CELL;
    gridCanvas.height = GRID_H*CELL;
    gridCanvas.style.width = (GRID_W*CELL)+'px';
    gridCanvas.style.height = (GRID_H*CELL)+'px';
    gctx.clearRect(0,0,gridCanvas.width,gridCanvas.height);
    if(!showGrid) return;
    gctx.strokeStyle = 'rgba(255,255,255,0.08)';
    gctx.lineWidth = 1;
    for(let x=0;x<=GRID_W;x++){
      gctx.beginPath();
      gctx.moveTo(x*CELL+0.5,0);
      gctx.lineTo(x*CELL+0.5,GRID_H*CELL);
      gctx.stroke();
    }
    for(let y=0;y<=GRID_H;y++){
      gctx.beginPath();
      gctx.moveTo(0,y*CELL+0.5);
      gctx.lineTo(GRID_W*CELL,y*CELL+0.5);
      gctx.stroke();
    }
  }

  resizeCanvasDisplay();

  // ---- Tool / color state ----
  let tool = 'pen';
  let color = '#7c5cff';
  let drawing = false;
  let startCell = null;
  let snapshotPixels = null;

  let undoStack = [];
  let redoStack = [];
  const MAX_HISTORY = 60;

  function pushHistory(){
    undoStack.push(pixels.slice());
    if(undoStack.length>MAX_HISTORY) undoStack.shift();
    redoStack = [];
  }
  function undo(){
    if(!undoStack.length) return;
    redoStack.push(pixels.slice());
    pixels = undoStack.pop();
    render();
    setStatus('Undo');
  }
  function redo(){
    if(!redoStack.length) return;
    undoStack.push(pixels.slice());
    pixels = redoStack.pop();
    render();
    setStatus('Redo');
  }

  function setStatus(t){ document.getElementById('status').textContent = t; }

  function getCell(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const scaleX = rect.width / GRID_W;
    const scaleY = rect.height / GRID_H;
    const x = Math.floor((clientX - rect.left)/scaleX);
    const y = Math.floor((clientY - rect.top)/scaleY);
    return {x,y};
  }

  function inBounds(x,y){ return x>=0 && y>=0 && x<GRID_W && y<GRID_H; }

  function setPixel(x,y,c){
    if(!inBounds(x,y)) return;
    pixels[idx(x,y)] = c;
  }

  function drawLine(x0,y0,x1,y1,plot){
    // Bresenham
    let dx = Math.abs(x1-x0), sx = x0<x1?1:-1;
    let dy = -Math.abs(y1-y0), sy = y0<y1?1:-1;
    let err = dx+dy, e2;
    while(true){
      plot(x0,y0);
      if(x0===x1 && y0===y1) break;
      e2 = 2*err;
      if(e2>=dy){ err+=dy; x0+=sx; }
      if(e2<=dx){ err+=dx; y0+=sy; }
    }
  }

  function floodFill(x,y,newColor){
    if(!inBounds(x,y)) return;
    const target = pixels[idx(x,y)];
    if(target === newColor) return;
    const stack = [[x,y]];
    while(stack.length){
      const [cx,cy] = stack.pop();
      if(!inBounds(cx,cy)) continue;
      if(pixels[idx(cx,cy)] !== target) continue;
      pixels[idx(cx,cy)] = newColor;
      stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
    }
  }

  function pointer(e){
    return getCell(e);
  }

  function down(e){
    e.preventDefault();
    const p = pointer(e);
    if(!inBounds(p.x,p.y)) return;
    drawing = true;
    startCell = p;
    pushHistory();

    if(tool==='pen'){
      setPixel(p.x,p.y,color); render();
    } else if(tool==='eraser'){
      setPixel(p.x,p.y,null); render();
    } else if(tool==='fill'){
      floodFill(p.x,p.y,color); render();
      drawing=false;
    } else if(tool==='picker'){
      const c = pixels[idx(p.x,p.y)];
      if(c){ color=c; document.getElementById('colorPicker').value=c; updatePaletteSelection(); }
      drawing=false;
      undoStack.pop(); // no change made
    } else if(tool==='line' || tool==='rect' || tool==='circle'){
      snapshotPixels = pixels.slice();
    }
  }

  function move(e){
    updatePosInfo(e);
    if(!drawing) return;
    e.preventDefault();
    const p = pointer(e);
    if(!inBounds(p.x,p.y) && tool!=='line' && tool!=='rect' && tool!=='circle') return;

    if(tool==='pen'){
      drawLine(startCell.x,startCell.y,p.x,p.y,(x,y)=>setPixel(x,y,color));
      startCell = p;
      render();
    } else if(tool==='eraser'){
      drawLine(startCell.x,startCell.y,p.x,p.y,(x,y)=>setPixel(x,y,null));
      startCell = p;
      render();
    } else if(tool==='line'){
      pixels = snapshotPixels.slice();
      drawLine(startCell.x,startCell.y,p.x,p.y,(x,y)=>setPixel(x,y,color));
      render();
    } else if(tool==='rect'){
      pixels = snapshotPixels.slice();
      const x0=Math.min(startCell.x,p.x), x1=Math.max(startCell.x,p.x);
      const y0=Math.min(startCell.y,p.y), y1=Math.max(startCell.y,p.y);
      for(let x=x0;x<=x1;x++){ setPixel(x,y0,color); setPixel(x,y1,color); }
      for(let y=y0;y<=y1;y++){ setPixel(x0,y,color); setPixel(x1,y,color); }
      render();
    } else if(tool==='circle'){
      pixels = snapshotPixels.slice();
      const cx=startCell.x, cy=startCell.y;
      const rx = Math.abs(p.x-startCell.x), ry=Math.abs(p.y-startCell.y);
      const r = Math.max(rx,ry);
      // midpoint-ish circle via angle sampling for simplicity
      const steps = Math.max(16, r*8);
      for(let i=0;i<steps;i++){
        const a = (i/steps)*Math.PI*2;
        const x = Math.round(cx + Math.cos(a)*rx);
        const y = Math.round(cy + Math.sin(a)*ry);
        setPixel(x,y,color);
      }
      render();
    }
  }

  function up(){
    if(!drawing) return;
    drawing = false;
  }

  function updatePosInfo(e){
    const p = pointer(e);
    const info = document.getElementById('posInfo');
    if(inBounds(p.x,p.y)) info.textContent = `(${p.x}, ${p.y})`;
    else info.textContent = '–';
  }

  canvas.addEventListener('mousedown', down);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
  canvas.addEventListener('touchstart', down, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', up);

  // ---- Toolbar ----
  const toolButtons = {
    pen: document.getElementById('toolPen'),
    eraser: document.getElementById('toolEraser'),
    line: document.getElementById('toolLine'),
    rect: document.getElementById('toolRect'),
    circle: document.getElementById('toolCircle'),
    fill: document.getElementById('toolFill'),
    picker: document.getElementById('toolPicker'),
  };
  Object.keys(toolButtons).forEach(key=>{
    toolButtons[key].addEventListener('click', ()=>{
      tool = key;
      Object.values(toolButtons).forEach(b=>b.classList.remove('active'));
      toolButtons[key].classList.add('active');
      setStatus('Tool: '+key);
    });
  });

  const colorPicker = document.getElementById('colorPicker');
  colorPicker.addEventListener('input', e=>{ color = e.target.value; updatePaletteSelection(); });

  const palette = document.getElementById('palette');
  const colors = ['#ffffff','#000000','#ff5c5c','#ffb84c','#ffe14c','#7cff6b','#4cc9ff','#7c5cff','#ff4cd6','#8a5a2f'];
  colors.forEach(c=>{
    const sw = document.createElement('div');
    sw.className = 'swatch';
    sw.style.background = c;
    sw.dataset.color = c;
    sw.addEventListener('click', ()=>{ color=c; colorPicker.value=c; updatePaletteSelection(); });
    palette.appendChild(sw);
  });
  function updatePaletteSelection(){
    [...palette.children].forEach(sw=>{
      sw.classList.toggle('selected', sw.dataset.color.toLowerCase() === color.toLowerCase());
    });
  }

  // grid size
  document.getElementById('resizeBtn').addEventListener('click', ()=>{
    const w = Math.max(4, Math.min(128, +document.getElementById('gridW').value || 32));
    const h = Math.max(4, Math.min(128, +document.getElementById('gridH').value || 32));
    pushHistory();
    const newPixels = initPixels(w,h);
    // copy overlap
    for(let y=0;y<Math.min(h,GRID_H);y++){
      for(let x=0;x<Math.min(w,GRID_W);x++){
        newPixels[y*w+x] = pixels[idx(x,y)];
      }
    }
    GRID_W = w; GRID_H = h;
    pixels = newPixels;
    resizeCanvasDisplay();
    setStatus(`Grid resized to ${w}x${h}`);
  });

  // zoom
  const zoomRange = document.getElementById('zoomRange');
  const zoomVal = document.getElementById('zoomVal');
  zoomRange.addEventListener('input', e=>{
    CELL = +e.target.value;
    zoomVal.textContent = CELL+'px';
    resizeCanvasDisplay();
  });

  // grid toggle
  const gridToggleBtn = document.getElementById('gridToggle');
  gridToggleBtn.addEventListener('click', ()=>{
    showGrid = !showGrid;
    gridToggleBtn.classList.toggle('active', showGrid);
    drawGridOverlay();
  });

  document.getElementById('undoBtn').addEventListener('click', undo);
  document.getElementById('redoBtn').addEventListener('click', redo);
  document.getElementById('clearBtn').addEventListener('click', ()=>{
    pushHistory();
    pixels = initPixels(GRID_W,GRID_H);
    render();
    setStatus('Cleared');
  });

  function exportPNG(scale){
    const off = document.createElement('canvas');
    off.width = GRID_W*scale;
    off.height = GRID_H*scale;
    const octx = off.getContext('2d');
    octx.imageSmoothingEnabled = false;
    for(let y=0;y<GRID_H;y++){
      for(let x=0;x<GRID_W;x++){
        const c = pixels[idx(x,y)];
        if(c){
          octx.fillStyle = c;
          octx.fillRect(x*scale,y*scale,scale,scale);
        }
      }
    }
    const link = document.createElement('a');
    link.download = `pixel_art_${GRID_W}x${GRID_H}.png`;
    link.href = off.toDataURL('image/png');
    link.click();
  }

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    exportPNG(1);
    setStatus('Saved PNG (1x, actual size)');
  });
  document.getElementById('saveBigBtn').addEventListener('click', ()=>{
    exportPNG(8);
    setStatus('Saved PNG (8x upscaled)');
  });

  // keyboard shortcuts
  window.addEventListener('keydown', e=>{
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
      e.preventDefault();
      if(e.shiftKey) redo(); else undo();
    }
    if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='y'){
      e.preventDefault();
      redo();
    }
  });

  setTimeout(()=>{ document.getElementById('hint').style.opacity='0'; }, 4000);

  updatePaletteSelection();
})();
</script>
</body>
</html>
